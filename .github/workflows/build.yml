name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make test build
      - run: |
          cp README.md LICENSE config.example.yaml settings.example.json dist/
          cd dist
          sha256sum cpa-quota-guard.so guard-state > BINARY_SHA256SUMS
          zip cpa-quota-guard_0.1.0_linux_amd64.zip cpa-quota-guard.so cpa-quota-guard.h guard-state README.md LICENSE config.example.yaml settings.example.json BINARY_SHA256SUMS
          sha256sum cpa-quota-guard_0.1.0_linux_amd64.zip > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-quota-guard-linux-amd64
          path: dist/*
