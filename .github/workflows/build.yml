name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make test package
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-quota-guard-linux-amd64
          path: dist/*
