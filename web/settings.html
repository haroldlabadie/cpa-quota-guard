<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>额度保护 · CPA</title>
<style nonce="{{NONCE}}">:root{color-scheme:light dark;font:16px system-ui}body{max-width:1120px;margin:30px auto;padding:0 20px}section{padding:20px;border:1px solid #8885;border-radius:12px;margin:18px 0}input,button,select{font:inherit;padding:8px;margin:4px}input[type=email]{width:230px}input[type=number]{width:65px}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #8883}pre{white-space:pre-wrap;overflow-wrap:anywhere}.hint{opacity:.75}button{cursor:pointer}#message{min-height:28px}.scroll{overflow-x:auto}</style>
<h1>额度保护 <small id="version"></small></h1><p class="hint">只管理显式白名单账号的额度限制。停止插件会保留现有保护；未知额度不会自动恢复凭证。</p>
<section id="session"><label>Management Key <input id="key" type="password" autocomplete="off"></label><button id="connect">连接</button><p class="hint">优先复用当前管理会话。手动输入的 Key 仅保留在当前页面内存。</p></section>
<p id="message" role="status"></p><section><h2>运行状态</h2><button id="refresh">刷新</button><pre id="status"></pre></section>
<section><h2>保护规则</h2><p class="hint">额度剩余达到保留比例即限制该账号。默认建议五小时 8%、每周 3%。关闭或删除规则会保留已有停用与模型排除；保存冲突时请先刷新。</p><div class="scroll"><table><thead><tr><th>账号邮箱</th><th>供应商</th><th>保护</th><th>五小时保留 %</th><th>每周保留 %</th><th></th></tr></thead><tbody id="rules"></tbody></table></div><button id="add">添加账号</button><button id="save">保存规则</button></section>
<section><h2>账号与采样</h2><div class="scroll"><table><thead><tr><th>账号</th><th>状态</th><th>剩余额度</th><th>原因 / 最近动作</th></tr></thead><tbody id="observations"></tbody></table></div></section><script nonce="{{NONCE}}">{{JS}}</script></html>
